# Configuración mínima de Mosquitto para EYESIA VISION (fase MVP local).
# Sin autenticación de usuario todavía: el broker solo debe quedar
# accesible dentro de la red del docker-compose / LAN local, nunca
# expuesto a internet. Se puede endurecer (password_file, TLS) en una
# fase posterior sin cambiar la arquitectura.

listener 1883
allow_anonymous true

persistence false
log_dest stdout
